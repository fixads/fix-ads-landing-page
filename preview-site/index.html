    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Performance Marketing Agency for Connected Growth | FixAds" />
    <meta
      name="twitter:description"
      content="Connect paid media, e-commerce, lead generation, automation, and analytics with a performance marketing agency focused on practical, measurable growth."
    />
    <meta name="twitter:image" content="https://www.fixads.xyz/assets/hero-team.jpg" />
    <meta name="twitter:image:alt" content="FixAds digital marketing team collaborating in a modern studio" />
    <link rel="icon" type="image/png" href="/assets/fixads-logo.png" />
    <link rel="apple-touch-icon" href="/assets/fixads-logo.png" />
    <link rel="canonical" href="https://www.fixads.xyz/en/" />
    <link rel="alternate" hreflang="en" href="https://www.fixads.xyz/en/" />
    <link rel="alternate" hreflang="de" href="https://www.fixads.xyz/de/" />
    <link rel="alternate" hreflang="he" href="https://www.fixads.xyz/he/" />
    <link rel="alternate" hreflang="x-default" href="https://www.fixads.xyz/en/" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (() => {
        const match = location.pathname.match(/^\/(en|de|he)(?:\/|$)/);
        const locale = match ? match[1] : "en";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "he" ? "rtl" : "ltr";
        document.documentElement.dataset.locale = locale;
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.fixads.xyz/#organization",
            "name": "FixAds",
            "url": "https://www.fixads.xyz/",
            "logo": "https://www.fixads.xyz/assets/fixads-logo.png",
            "image": "https://www.fixads.xyz/assets/hero-team.jpg",
            "email": "info@fixads.xyz",
            "description": "FixAds connects paid media, e-commerce, lead generation, automation, and analytics into one measurable digital growth system."
          },
          {
            "@type": "WebSite",
            "@id": "https://www.fixads.xyz/#website",
            "url": "https://www.fixads.xyz/",
            "name": "FixAds",
            "publisher": { "@id": "https://www.fixads.xyz/#organization" },
            "inLanguage": ["en", "de", "he"]
          }
        ]
      }
    </script>
    <title>Performance Marketing Agency for Connected Growth | FixAds</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div id="app"></div>

    <form
      name="fixads-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="fixads-contact" />
      <input name="bot-field" />
      <input name="full-name" />
      <input name="company" />
      <input name="phone" />
      <input name="email" />
      <input name="website" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="locale" />
      <input name="consent" />
    </form>

    <noscript>
      <div class="noscript">Please enable JavaScript to view this website.</div>
    </noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
