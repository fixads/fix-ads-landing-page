    <script>
      (() => {
        const match = location.pathname.match(/^\/(en|de|he)(?:\/|$)/);
        const locale = match ? match[1] : "en";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "he" ? "rtl" : "ltr";
        document.documentElement.dataset.locale = locale;
      })();
    </script>
    <script>
      (() => {
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const localePage = /^\/(en|de|he)\/?$/.test(location.pathname);
        if (!reduced && localePage && !location.hash) {
          document.documentElement.classList.add("loader-wanted");
          window.__fixadsLoaderStarted = performance.now();
        }
      })();
    </script>

    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <div class="site-loader" id="site-loader" aria-hidden="true">
      <div class="site-loader__brand">
        <span class="site-loader__mark"><img src="/assets/fixads-logo.png" alt="" width="72" height="72" /></span>
        <strong>FixAds</strong>
      </div>
      <div class="site-loader__line"><span></span></div>
    </div>
    <script>
      (() => {
        const root = document.documentElement;
        const loader = document.getElementById("site-loader");
        if (!root.classList.contains("loader-wanted") || !loader) return;

        loader.setAttribute("aria-hidden", "false");
        requestAnimationFrame(() => loader.classList.add("is-active"));
        let hidden = false;
        const hide = () => {
          if (hidden) return;
          hidden = true;
          root.classList.remove("loader-wanted");
          root.classList.add("loader-done");
          loader.classList.add("is-leaving");
          loader.setAttribute("aria-hidden", "true");
          window.dispatchEvent(new Event("fixads:ready"));
          setTimeout(() => {
            loader.hidden = true;
          }, 220);
        };
        const start = window.__fixadsLoaderStarted || performance.now();
        const afterMinimum = () => setTimeout(hide, Math.max(0, 620 - (performance.now() - start)));
        addEventListener("load", afterMinimum, { once: true });
        addEventListener("pageshow", (event) => {
          if (event.persisted) hide();
        });
        setTimeout(hide, 900);
      })();
    </script>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div id="app"></div>

    <form
      name="fixads-contact"
